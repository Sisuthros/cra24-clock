<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRA 24h Clock: paid service paused</title>
<meta name="description" content="The paid CRA 24h Clock services are paused. The tool itself is free and open source (MIT).">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #9da7b3; --accent: #4cc38a; --warn: #e5534b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 1rem 0 .5rem; }
  h2 { font-size: 1.25rem; margin: 2.5rem 0 .75rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
  h3 { font-size: 1.05rem; margin: 1.25rem 0 .5rem; }
  p, li { color: var(--text); }
  .muted { color: var(--muted); }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
        padding: 1rem; overflow-x: auto; font-size: .85rem; line-height: 1.5; }
  code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .k { color: var(--accent); }
  .badge { display: inline-block; border: 1px solid var(--border); border-radius: 999px;
           padding: .1rem .6rem; font-size: .8rem; color: var(--muted); margin-right: .4rem; }
  .no { color: var(--warn); font-weight: 600; }
  .yes { color: var(--accent); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  td, th { border: 1px solid var(--border); padding: .5rem .7rem; text-align: left; vertical-align: top; }
  a { color: #58a6ff; }
  .price { font-size: 2.2rem; font-weight: 700; }
  footer { margin-top: 3rem; border-top: 1px solid var(--border); padding-top: 1rem;
           font-size: .85rem; color: var(--muted); }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; }
</style>
</head>
<body>
<main>

  <p class="muted"><span class="badge">CRA 24h Clock</span><span class="badge">paid service</span></p>

  <h1>The paid setup service is paused.</h1>

  <div class="box">
    <p>No purchase can be made or confirmed on this site at the moment.</p>
    <p>The tool is free and open source (MIT) and works without any purchase:
    <a href="./">CRA 24h Clock</a>.</p>
    <p>Questions and bug reports:
    <a href="https://github.com/Sisuthros/cra24-clock/issues">open an issue</a>.</p>
  </div>

  <footer>
    <p><a href="./">&larr; Back to CRA 24h Clock</a></p>
  </footer>

</main>
</body>
</html>
